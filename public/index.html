<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>منصة مايند - مراجعة التحليلات البلدية في قطر</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg-top: #f8f3e7;
      --bg-bottom: #ece2d2;
      --panel: rgba(255, 251, 245, 0.9);
      --panel-strong: rgba(255, 255, 255, 0.94);
      --text: #17263a;
      --muted: #5f6d80;
      --line: rgba(23, 38, 58, 0.12);
      --accent: #0f766e;
      --accent-dark: #0b5954;
      --accent-soft: rgba(15, 118, 110, 0.12);
      --error: #b63d2c;
      --shadow: 0 20px 50px rgba(23, 38, 58, 0.12);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      direction: rtl;
      text-align: right;
      background:
        radial-gradient(circle at top left, rgba(218, 166, 57, 0.18), transparent 28%),
        radial-gradient(circle at top right, rgba(15, 118, 110, 0.14), transparent 24%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    }

    .page {
      max-width: 1320px;
      margin: 0 auto;
      padding: 28px 18px 40px;
    }

    .shell {
      display: grid;
      gap: 20px;
    }

    .hero,
    .panel,
    .results-panel,
    .audit-panel {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .hero {
      padding: 28px;
      border-radius: var(--radius-xl);
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 3.3rem);
      line-height: 1;
      letter-spacing: -0.04em;
      margin-bottom: 10px;
    }

    .subtitle {
      max-width: 78ch;
      color: var(--muted);
      line-height: 1.7;
      font-size: 1rem;
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .panel {
      padding: 22px;
      border-radius: var(--radius-lg);
    }

    .endpoint-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .endpoint-tabs button,
    .examples button,
    #go,
    #prompt {
      font: inherit;
    }

    .endpoint-tabs button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel-strong);
      color: var(--text);
      border-radius: 999px;
      padding: 12px 18px;
      cursor: pointer;
      transition: 160ms ease;
    }

    .endpoint-tabs button:hover,
    .endpoint-tabs button.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-dark);
      transform: translateY(-1px);
    }

    .composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: stretch;
      margin-bottom: 18px;
    }

    #prompt {
      width: 100%;
      min-height: 62px;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px 18px;
      background: var(--panel-strong);
      color: var(--text);
      outline: none;
      resize: vertical;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    #prompt:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 5px var(--accent-soft);
    }

    #go {
      border: none;
      border-radius: 20px;
      min-width: 140px;
      padding: 0 24px;
      cursor: pointer;
      color: #f8f7f2;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      font-weight: 600;
      box-shadow: 0 14px 28px rgba(15, 118, 110, 0.24);
      transition: 160ms ease;
    }

    #go:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 18px 30px rgba(15, 118, 110, 0.28);
    }

    #go:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      box-shadow: none;
    }

    .examples {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .examples button {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.82);
      color: var(--text);
      border-radius: 18px;
      padding: 14px 16px;
      text-align: left;
      cursor: pointer;
      transition: 160ms ease;
      line-height: 1.45;
    }

    .examples button:hover {
      border-color: var(--accent);
      background: #fff;
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(23, 38, 58, 0.08);
    }

    .content {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(260px, 0.75fr);
      gap: 20px;
      align-items: start;
    }

    .results-panel,
    .audit-panel {
      border-radius: var(--radius-lg);
      padding: 22px;
    }

    .results-panel {
      min-height: 560px;
    }

    .section-title {
      font-size: 1.1rem;
      margin-bottom: 14px;
    }

    .surface {
      display: grid;
      gap: 16px;
    }

    #chart-wrap,
    #output-text {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(248, 242, 233, 0.98));
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
    }

    #chart-wrap {
      padding: 12px;
    }

    #chart {
      width: 100%;
      height: 500px;
      background: linear-gradient(180deg, #152232 0%, #0f1724 100%);
      border-radius: 14px;
    }

    #output-text {
      padding: 22px;
      min-height: 220px;
      line-height: 1.7;
    }

    #output-text h3 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 1.08rem;
    }

    #output-text p {
      color: var(--muted);
      margin-bottom: 16px;
    }

    #output-text p:last-child {
      margin-bottom: 0;
    }

    .record-link {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      margin: 4px 6px 0 0;
      border-radius: 999px;
      background: rgba(15, 118, 110, 0.1);
      color: var(--accent-dark);
      font-size: 13px;
      border: 1px solid rgba(15, 118, 110, 0.14);
    }

    .audit-panel details summary {
      cursor: pointer;
      color: var(--muted);
      padding: 4px 0 14px;
      user-select: none;
    }

    #audit-pre {
      margin: 0;
      padding: 18px;
      background: #142230;
      color: #dbe8f5;
      border-radius: 18px;
      overflow: auto;
      font-size: 12px;
      line-height: 1.6;
      direction: ltr;
      text-align: left;
    }

    .error {
      color: var(--error);
      background: rgba(182, 61, 44, 0.08);
      border: 1px solid rgba(182, 61, 44, 0.16);
      padding: 14px 16px;
      border-radius: 16px;
    }

    @media (max-width: 980px) {
      .content {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      .page {
        padding: 16px 12px 28px;
      }

      .hero,
      .panel,
      .results-panel,
      .audit-panel {
        padding: 18px;
        border-radius: 20px;
      }

      .composer {
        grid-template-columns: 1fr;
      }

      #go {
        min-height: 56px;
      }

      #chart {
        height: 340px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="shell">
      <header class="hero">
        <h1>منصة مايند · التحليلات البلدية في قطر</h1>
        <p class="subtitle">استعرض مسار العمل الكامل بين الاستعلام والتقرير ولوحة المعلومات باستخدام بيانات تشغيلية مزروعة للبلديات والتصاريح والتفتيشات والمشاريع.</p>
      </header>

      <section class="workspace">
        <div class="panel">
          <div class="endpoint-tabs">
            <button class="active" data-endpoint="/api/dashboard">لوحة المعلومات</button>
            <button data-endpoint="/api/report">التقرير</button>
            <button data-endpoint="/api/inquiry">الاستعلام</button>
          </div>

          <div class="composer">
            <textarea id="prompt" placeholder="مثال: طلبات الخدمة حسب البلدية خلال هذا الشهر" rows="2"></textarea>
            <button id="go" type="button">تشغيل</button>
          </div>

          <div class="examples" id="examples"></div>
        </div>

        <div class="content">
          <section class="results-panel">
            <h2 class="section-title">النتيجة</h2>
            <div class="surface">
              <div id="chart-wrap">
                <div id="chart"></div>
              </div>
              <div id="output-text" style="display:none"></div>
            </div>
          </section>

          <aside class="audit-panel">
            <h2 class="section-title">التدقيق</h2>
            <details open>
              <summary>الخطة وخط التنفيذ والمدة</summary>
              <pre id="audit-pre">—</pre>
            </details>
          </aside>
        </div>
      </section>
    </div>
  </div>

  <script>
    const SCOPE = {
      userId: 'u_review',
      tenantId: 't_mind_qatar',
      allowedBlueprintIds: ['bp_municipal_operations', 'bp_urban_planning'],
    };

    const chartWrap = document.getElementById('chart-wrap');
    const chartDiv = document.getElementById('chart');
    const outputText = document.getElementById('output-text');
    const auditPre = document.getElementById('audit-pre');
    const promptInput = document.getElementById('prompt');
    const goBtn = document.getElementById('go');
    const examplesDiv = document.getElementById('examples');

    let chart = echarts.init(chartDiv, 'dark');
    window.addEventListener('resize', () => chart.resize());

    let currentEndpoint = '/api/dashboard';

    const EXAMPLES = {
      '/api/dashboard': {
        placeholder: 'مثال: متوسط درجة التفتيش حسب البلدية',
        prompts: [
          { label: 'حالة طلبات الخدمة حسب البلدية', prompt: 'اعرض حالة طلبات الخدمة حسب البلدية' },
          { label: 'درجة التفتيش حسب البلدية', prompt: 'اعرض متوسط درجة التفتيش حسب البلدية' },
          { label: 'المخالفات حسب المنطقة', prompt: 'اعرض مخالفات التفتيش حسب المنطقة' },
          { label: 'التصاريح المفتوحة حسب البلدية', prompt: 'اعرض التصاريح المفتوحة حسب البلدية' },
          { label: 'ميزانية المشاريع حسب البلدية', prompt: 'اعرض إجمالي ميزانية المشاريع حسب البلدية' },
          { label: 'نسبة إنجاز المشاريع حسب المقاول', prompt: 'اعرض متوسط نسبة إنجاز المشاريع حسب المقاول' },
        ],
      },
      '/api/report': {
        placeholder: 'مثال: أنشئ تقريراً عن نتائج التفتيش حسب البلدية خلال آخر 30 يوماً',
        prompts: [
          { label: 'عمليات طلبات الخدمة', prompt: 'أنشئ تقريراً عن طلبات الخدمة حسب البلدية والحالة والأولوية خلال آخر 30 يوماً' },
          { label: 'الامتثال في التفتيش', prompt: 'أنشئ تقريراً عن نتائج التفتيش حسب البلدية خلال آخر 30 يوماً' },
          { label: 'اختناقات التصاريح', prompt: 'أنشئ تقريراً عن التصاريح حسب نوع مقدم الطلب والحالة والبلدية خلال آخر 30 يوماً' },
          { label: 'تسليم المشاريع', prompt: 'أنشئ تقريراً عن مرحلة المشروع والمقاول ونسبة الإنجاز حسب البلدية' },
        ],
      },
      '/api/inquiry': {
        placeholder: 'مثال: اعرض التفتيشات الحديثة التي نتيجتها مخالفة',
        prompts: [
          { label: 'طلبات الخدمة الجديدة', prompt: 'اعرض طلبات الخدمة الحديثة التي حالتها جديد' },
          { label: 'الطلبات العاجلة قيد التنفيذ', prompt: 'اعرض طلبات الخدمة التي أولويتها عاجل وحالتها قيد التنفيذ' },
          { label: 'مخالفات التفتيش', prompt: 'اعرض التفتيشات الحديثة التي نتيجتها مخالفة' },
          { label: 'التصاريح قيد المراجعة', prompt: 'اعرض التصاريح التي حالتها قيد المراجعة مع البلدية ونوع مقدم الطلب' },
          { label: 'المشاريع المكتملة', prompt: 'اعرض المشاريع التي مرحلتها مكتملة مع البلدية والمقاول' },
        ],
      },
    };

    function renderExamples() {
      const config = EXAMPLES[currentEndpoint];
      promptInput.placeholder = config.placeholder;
      examplesDiv.innerHTML = config.prompts
        .map(({ label, prompt }) => `<button data-prompt="${escapeAttr(prompt)}">${escape(label)}</button>`)
        .join('');

      examplesDiv.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => {
          promptInput.value = button.dataset.prompt;
          run();
        });
      });
    }

    document.querySelectorAll('.endpoint-tabs button').forEach((button) => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.endpoint-tabs button').forEach((item) => item.classList.remove('active'));
        button.classList.add('active');
        currentEndpoint = button.dataset.endpoint;
        renderExamples();
      });
    });

    promptInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        run();
      }
    });

    goBtn.addEventListener('click', run);
    renderExamples();

    async function run() {
      const prompt = promptInput.value.trim();
      if (!prompt) return;

      goBtn.disabled = true;
      goBtn.textContent = 'جارٍ التشغيل...';
      auditPre.textContent = '—';

      try {
        const response = await fetch(currentEndpoint, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ prompt, scope: SCOPE }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error ?? 'فشل الطلب');
        render(data);
      } catch (error) {
        chartWrap.style.display = 'none';
        outputText.style.display = 'block';
        outputText.innerHTML = `<div class="error">خطأ: ${escape(error.message)}</div>`;
      } finally {
        goBtn.disabled = false;
        goBtn.textContent = 'تشغيل';
      }
    }

    function render(data) {
      auditPre.textContent = JSON.stringify(data.audit, null, 2);

      if (data.intent === 'dashboard' && data.chart) {
        chartWrap.style.display = 'block';
        outputText.style.display = 'none';
        chart.clear();
        chart.setOption(data.chart.option);
      } else if (data.intent === 'report') {
        chartWrap.style.display = data.charts?.[0] ? 'block' : 'none';
        outputText.style.display = 'block';
        outputText.innerHTML = (data.reportSections || [])
          .map((section) => `<h3>${escape(section.heading)}</h3><p>${escape(section.body)}</p>`)
          .join('');
        if (data.charts?.[0]) {
          chart.clear();
          chart.setOption(data.charts[0].option);
        }
      } else if (data.intent === 'general_question') {
        chartWrap.style.display = 'none';
        outputText.style.display = 'block';
        outputText.innerHTML = `<p>${escape(data.summary || '')}</p>` +
          (data.recordLinks || []).map((link) => `<span class="record-link">${escape(link.label)}</span>`).join('');
      }
    }

    function escape(value) {
      return String(value ?? '').replace(/[&<>]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[char]));
    }

    function escapeAttr(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
